<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NetCalc Scientific</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
        }
        body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        input, textarea {
            -webkit-user-select: none;
            user-select: none;
        }
        .calc-btn {
            transition: background-color 0.08s ease, transform 0.08s ease;
            -webkit-tap-highlight-color: transparent;
            active: state;
            border: none;
            cursor: pointer;
        }
        .calc-btn:active {
            transform: scale(0.94);
            background-color: rgba(226, 232, 240, 0.15);
        }
        .display-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 0;
            flex-shrink: 0;
            padding: 0.5rem 0.75rem;
            height: auto;
            max-height: 20vh;
        }
        .expression-line {
            font-size: 0.65rem;
            color: rgb(100, 116, 139);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.125rem;
        }
        .expression-input {
            font-size: 0.75rem;
            font-family: 'Courier New', monospace;
            color: rgb(34, 197, 94);
            background: transparent;
            border: none;
            outline: none;
            margin-bottom: 0.25rem;
            padding: 0;
            line-height: 1.2;
        }
        .result-display {
            font-size: 1.375rem;
            font-weight: 300;
            color: rgb(226, 232, 240);
            word-break: break-word;
            min-height: 1.75rem;
            padding: 0.25rem 0;
            line-height: 1.3;
        }
        .numerical-display {
            font-size: 0.75rem;
            font-family: 'Courier New', monospace;
            color: rgb(251, 191, 36);
            margin-top: 0.25rem;
            min-height: 1rem;
            overflow-x: auto;
            white-space: nowrap;
            opacity: 0.75;
            line-height: 1.2;
        }
        .keypad-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.375rem;
            padding: 0.5rem;
            background: rgb(15, 23, 42);
            border-top: 1px solid rgba(71, 85, 105, 0.3);
            flex: 1;
            overflow-y: auto;
        }
        .btn-scientific {
            background-color: rgb(30, 41, 59);
            color: rgb(34, 211, 238);
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            line-height: 1.2;
        }
        .btn-number {
            background-color: rgba(51, 65, 85, 0.4);
            color: rgb(226, 232, 240);
            font-size: 1.125rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-family: 'Courier New', monospace;
        }
        .btn-operator {
            background-color: rgb(30, 41, 59);
            color: rgb(34, 211, 238);
            font-size: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }
        .btn-clear {
            background-color: rgba(159, 18, 57, 0.4);
            color: rgb(251, 113, 133);
            font-size: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .btn-equals {
            background: linear-gradient(to right, rgb(6, 182, 212), rgb(59, 130, 246));
            color: white;
            font-size: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.1);
        }
        .btn-equals:active {
            box-shadow: 0 5px 10px -2px rgba(6, 182, 212, 0.2);
        }
        .btn-ans {
            background-color: rgb(30, 41, 59);
            color: rgb(251, 191, 36);
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
        }
        .more-functions {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.375rem;
            padding: 0.375rem 0.5rem;
            background: rgb(20, 29, 48);
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }
        .more-functions button {
            font-size: 0.65rem;
            padding: 0.375rem;
            background-color: rgb(30, 41, 59);
            color: rgb(148, 163, 184);
        }
        .header-bar {
            background: linear-gradient(to bottom, rgb(15, 23, 42), rgb(2, 6, 23));
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
            padding: 0.5rem 0.75rem;
            flex-shrink: 0;
        }
        .safe-area-inset-bottom {
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
        }
        @supports (padding: max(0px)) {
            .keypad-container {
                padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
            }
        }
        .container-root {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            background: rgb(15, 23, 42);
        }
    </style>
</head>
<body class=\"bg-slate-950 text-white font-sans overflow-hidden\" style=\"margin:0; padding:0;\">

    <div class=\"container-root\">
        <!-- Header Bar -->
        <div class=\"header-bar text-center text-xs font-semibold text-slate-400 tracking-wider\">
            NetCalc Scientific
        </div>

        <!-- Display Section: Compact -->\n        <div class=\"display-section bg-gradient-to-b from-slate-900 to-slate-950\">\n            <!-- Expression label -->\n            <div class=\"expression-line\">Expression</div>\n            <!-- Expression buffer -->\n            <input id=\"input-buffer\" type=\"text\" class=\"expression-input\" placeholder=\"0\" readonly inputmode=\"none\">\n            <!-- Main result display (KaTeX) -->\n            <div id=\"latex-display\" class=\"result-display\"></div>\n            <!-- Numerical result -->\n            <div id=\"numerical-display\" class=\"numerical-display\"></div>\n        </div>\n\n        <!-- More Functions Row (Toggle) -->\n        <div id=\"more-functions-row\" class=\"more-functions\" style=\"display: none;\">\n            <button onclick=\"appendToken('sin('); toggleMore();\" class=\"calc-btn btn-scientific\">sin</button>\n            <button onclick=\"appendToken('cos('); toggleMore();\" class=\"calc-btn btn-scientific\">cos</button>\n            <button onclick=\"appendToken('tan('); toggleMore();\" class=\"calc-btn btn-scientific\">tan</button>\n            <button onclick=\"appendToken('exp('); toggleMore();\" class=\"calc-btn btn-scientific\">exp</button>\n            <button onclick=\"appendToken('ln('); toggleMore();\" class=\"calc-btn btn-scientific\">ln</button>\n        </div>\n\n        <!-- Main Keypad -->\n        <div class=\"keypad-container safe-area-inset-bottom\">\n            <!-- Row 1: Advanced functions + X -->\n            <button onclick=\"appendToken('diff(')\" class=\"calc-btn btn-scientific\">d/dx</button>\n            <button onclick=\"appendToken('integrate(')\" class=\"calc-btn btn-scientific\">∫</button>\n            <button onclick=\"appendToken('limit(')\" class=\"calc-btn btn-scientific\">lim</button>\n            <button onclick=\"toggleMore();\" class=\"calc-btn btn-scientific\" title=\"Toggle sin, cos, tan, exp, ln\">MORE</button>\n            <button onclick=\"appendToken('x')\" class=\"calc-btn btn-number\" style=\"color: rgb(251, 191, 36); font-weight: 700;\">X</button>\n\n            <!-- Row 2: sqrt, power, log, parens -->\n            <button onclick=\"appendToken('sqrt(')\" class=\"calc-btn btn-scientific\">√</button>\n            <button onclick=\"appendToken('^')\" class=\"calc-btn btn-scientific\">xʸ</button>\n            <button onclick=\"appendToken('log(')\" class=\"calc-btn btn-scientific\">log</button>\n            <button onclick=\"appendToken('(')\" class=\"calc-btn btn-operator\">(</button>\n            <button onclick=\"appendToken(')')\" class=\"calc-btn btn-operator\">)</button>\n\n            <!-- Row 3: 7 8 9 AC DEL -->\n            <button onclick=\"appendToken('7')\" class=\"calc-btn btn-number\">7</button>\n            <button onclick=\"appendToken('8')\" class=\"calc-btn btn-number\">8</button>\n            <button onclick=\"appendToken('9')\" class=\"calc-btn btn-number\">9</button>\n            <button onclick=\"clearBuffer()\" class=\"calc-btn btn-clear\">AC</button>\n            <button onclick=\"backspace()\" class=\"calc-btn btn-operator\">DEL</button>\n\n            <!-- Row 4: 4 5 6 * / -->\n            <button onclick=\"appendToken('4')\" class=\"calc-btn btn-number\">4</button>\n            <button onclick=\"appendToken('5')\" class=\"calc-btn btn-number\">5</button>\n            <button onclick=\"appendToken('6')\" class=\"calc-btn btn-number\">6</button>\n            <button onclick=\"appendToken('*')\" class=\"calc-btn btn-operator\">×</button>\n            <button onclick=\"appendToken('/')\" class=\"calc-btn btn-operator\">÷</button>\n\n            <!-- Row 5: 1 2 3 + − -->\n            <button onclick=\"appendToken('1')\" class=\"calc-btn btn-number\">1</button>\n            <button onclick=\"appendToken('2')\" class=\"calc-btn btn-number\">2</button>\n            <button onclick=\"appendToken('3')\" class=\"calc-btn btn-number\">3</button>\n            <button onclick=\"appendToken('+')\" class=\"calc-btn btn-operator\">+</button>\n            <button onclick=\"appendToken('-')\" class=\"calc-btn btn-operator\">−</button>\n\n            <!-- Row 6: 0 . π Ans = (5 equal columns) -->\n            <button onclick=\"appendToken('0')\" class=\"calc-btn btn-number\">0</button>\n            <button onclick=\"appendToken('.')\" class=\"calc-btn btn-number\">.</button>\n            <button onclick=\"appendToken('pi')\" class=\"calc-btn btn-scientific\">π</button>\n            <button onclick=\"appendAns()\" class=\"calc-btn btn-ans\">Ans</button>\n            <button onclick=\"executeCalculation()\" class=\"calc-btn btn-equals\">=</button>\n        </div>\n    </div>\n\n    <script>\n        const inputBuf = document.getElementById('input-buffer');\n        const latexDisplay = document.getElementById('latex-display');\n        const numDisplay = document.getElementById('numerical-display');\n        const moreRow = document.getElementById('more-functions-row');\n        \n        let lastAnswer = '';\n\n        function appendToken(token) {\n            inputBuf.value += token;\n            renderPreview(inputBuf.value);\n        }\n\n        function appendAns() {\n            if (lastAnswer === '') {\n                inputBuf.value += '0';\n            } else {\n                inputBuf.value += '(' + lastAnswer + ')';\n            }\n            renderPreview(inputBuf.value);\n        }\n\n        function toggleMore() {\n            if (moreRow.style.display === 'none') {\n                moreRow.style.display = 'grid';\n            } else {\n                moreRow.style.display = 'none';\n            }\n        }\n\n        function clearBuffer() {\n            inputBuf.value = '';\n            latexDisplay.innerHTML = '';\n            numDisplay.innerText = '';\n            moreRow.style.display = 'none';\n        }\n\n        function backspace() {\n            inputBuf.value = inputBuf.value.slice(0, -1);\n            renderPreview(inputBuf.value);\n        }\n\n        function renderPreview(text) {\n            if (!text) {\n                latexDisplay.innerHTML = '';\n                return;\n            }\n            let formatted = text.replace(/\\*/g, '\\\\cdot ').replace(/\\//g, '\\\\div ');\n            try {\n                katex.render(formatted, latexDisplay, { throwOnError: false });\n            } catch (err) {\n                // Silently fail on parse errors during preview\n            }\n        }\n\n        async function executeCalculation() {\n            const rawExpr = inputBuf.value;\n            if (!rawExpr) return;\n\n            latexDisplay.innerHTML = '<span class=\"text-sm text-cyan-500 tracking-wider\">Computing...</span>';\n            \n            try {\n                const response = await fetch('/api/compute', {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'application/json' },\n                    body: JSON.stringify({ expression: rawExpr, precision: 120 })\n                });\n                \n                const data = await response.json();\n                if (data.status === 'success') {\n                    katex.render(data.latex_output, latexDisplay, { throwOnError: false });\n                    numDisplay.innerText = '= ' + data.numerical_output;\n                    lastAnswer = data.numerical_output;\n                } else {\n                    latexDisplay.innerHTML = '<span class=\"text-sm text-rose-500\">Syntax Error</span>';\n                    numDisplay.innerText = '';\n                }\n            } catch (e) {\n                latexDisplay.innerHTML = '<span class=\"text-sm text-rose-500\">Computation Error</span>';\n                numDisplay.innerText = '';\n            }\n        }\n\n        // Prevent native keyboard from opening on any focus\n        document.addEventListener('touchstart', function(e) {\n            if (e.target.tagName === 'INPUT') {\n                e.target.blur();\n            }\n        }, { passive: false });\n    </script>\n</body>\n</html>
