<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NetCalc Scientific</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
        }
        body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        input, textarea {
            -webkit-user-select: none;
            user-select: none;
        }
        .calc-btn {
            transition: background-color 0.08s ease, transform 0.08s ease;
            -webkit-tap-highlight-color: transparent;
            active: state;
            border: none;
            cursor: pointer;
        }
        .calc-btn:active {
            transform: scale(0.94);
            background-color: rgba(226, 232, 240, 0.15);
        }
        .display-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 0;
        }
        .expression-line {
            font-size: 0.75rem;
            color: rgb(100, 116, 139);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        .expression-input {
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
            color: rgb(34, 197, 94);
            background: transparent;
            border: none;
            outline: none;
            margin-bottom: 0.5rem;
            padding: 0;
        }
        .result-display {
            font-size: 1.75rem;
            font-weight: 300;
            color: rgb(226, 232, 240);
            word-break: break-word;
            min-height: 2.5rem;
            padding: 0.5rem 0;
        }
        .numerical-display {
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
            color: rgb(251, 191, 36);
            margin-top: 0.5rem;
            min-height: 1.25rem;
            overflow-x: auto;
            white-space: nowrap;
            opacity: 0.75;
        }
        .keypad-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.375rem;
            padding: 0.5rem;
            background: rgb(15, 23, 42);
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }
        .btn-scientific {
            background-color: rgb(30, 41, 59);
            color: rgb(34, 211, 238);
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            line-height: 1.2;
        }
        .btn-number {
            background-color: rgba(51, 65, 85, 0.4);
            color: rgb(226, 232, 240);
            font-size: 1.125rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-family: 'Courier New', monospace;
        }
        .btn-operator {
            background-color: rgb(30, 41, 59);
            color: rgb(34, 211, 238);
            font-size: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }
        .btn-clear {
            background-color: rgba(159, 18, 57, 0.4);
            color: rgb(251, 113, 133);
            font-size: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .btn-equals {
            background: linear-gradient(to right, rgb(6, 182, 212), rgb(59, 130, 246));
            color: white;
            font-size: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            grid-column: span 2;
            box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.1);
        }
        .btn-equals:active {
            box-shadow: 0 5px 10px -2px rgba(6, 182, 212, 0.2);
        }
        .btn-ans {
            background-color: rgb(30, 41, 59);
            color: rgb(251, 191, 36);
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
        }
        .more-functions {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.375rem;
            padding: 0.375rem 0.5rem;
            background: rgb(20, 29, 48);
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }
        .more-functions button {
            font-size: 0.65rem;
            padding: 0.375rem;
            background-color: rgb(30, 41, 59);
            color: rgb(148, 163, 184);
        }
        .header-bar {
            background: linear-gradient(to bottom, rgb(15, 23, 42), rgb(2, 6, 23));
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
            padding: 0.5rem 0.75rem;
        }
        .safe-area-inset-bottom {
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
        }
        @supports (padding: max(0px)) {
            .keypad-container {
                padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans flex flex-col overflow-hidden">

    <!-- Header Bar -->
    <div class="header-bar text-center text-xs font-semibold text-slate-400 tracking-wider">
        NetCalc Scientific
    </div>

    <!-- Display Section: Compact 3-level hierarchy -->
    <div class="display-section flex-grow px-3 py-2 bg-gradient-to-b from-slate-900 to-slate-950 min-h-0">
        <!-- Expression label -->
        <div class="expression-line">Expression</div>
        <!-- Expression buffer -->
        <input id="input-buffer" type="text" class="expression-input" placeholder="0" readonly inputmode="none">
        <!-- Main result display (KaTeX) -->
        <div id="latex-display" class="result-display"></div>
        <!-- Numerical result -->
        <div id="numerical-display" class="numerical-display"></div>
    </div>

    <!-- More Functions Row (Toggle) -->
    <div id="more-functions-row" class="more-functions" style="display: none;">
        <button onclick="appendToken('sin('); toggleMore();" class="calc-btn btn-scientific">sin</button>
        <button onclick="appendToken('cos('); toggleMore();" class="calc-btn btn-scientific">cos</button>
        <button onclick="appendToken('tan('); toggleMore();" class="calc-btn btn-scientific">tan</button>
        <button onclick="appendToken('exp('); toggleMore();" class="calc-btn btn-scientific">exp</button>
        <button onclick="appendToken('ln('); toggleMore();" class="calc-btn btn-scientific">ln</button>
    </div>

    <!-- Main Keypad -->
    <div class="keypad-container safe-area-inset-bottom">
        <!-- Row 1: Advanced functions + X -->
        <button onclick="appendToken('diff(')" class="calc-btn btn-scientific">d/dx</button>
        <button onclick="appendToken('integrate(')" class="calc-btn btn-scientific">∫</button>
        <button onclick="appendToken('limit(')" class="calc-btn btn-scientific">lim</button>
        <button onclick="toggleMore();" class="calc-btn btn-scientific" title="Toggle sin, cos, tan, exp, ln">MORE</button>
        <button onclick="appendToken('x')" class="calc-btn btn-number" style="color: rgb(251, 191, 36); font-weight: 700;">X</button>

        <!-- Row 2: sqrt, power, log, parens -->
        <button onclick="appendToken('sqrt(')" class="calc-btn btn-scientific">√</button>
        <button onclick="appendToken('^')" class="calc-btn btn-scientific">xʸ</button>
        <button onclick="appendToken('log(')" class="calc-btn btn-scientific">log</button>
        <button onclick="appendToken('(')" class="calc-btn btn-operator">(</button>
        <button onclick="appendToken(')')" class="calc-btn btn-operator">)</button>

        <!-- Row 3: 7 8 9 AC DEL -->
        <button onclick="appendToken('7')" class="calc-btn btn-number">7</button>
        <button onclick="appendToken('8')" class="calc-btn btn-number">8</button>
        <button onclick="appendToken('9')" class="calc-btn btn-number">9</button>
        <button onclick="clearBuffer()" class="calc-btn btn-clear">AC</button>
        <button onclick="backspace()" class="calc-btn btn-operator">DEL</button>

        <!-- Row 4: 4 5 6 * / -->
        <button onclick="appendToken('4')" class="calc-btn btn-number">4</button>
        <button onclick="appendToken('5')" class="calc-btn btn-number">5</button>
        <button onclick="appendToken('6')" class="calc-btn btn-number">6</button>
        <button onclick="appendToken('*')" class="calc-btn btn-operator">×</button>
        <button onclick="appendToken('/')" class="calc-btn btn-operator">÷</button>

        <!-- Row 5: 1 2 3 + − -->
        <button onclick="appendToken('1')" class="calc-btn btn-number">1</button>
        <button onclick="appendToken('2')" class="calc-btn btn-number">2</button>
        <button onclick="appendToken('3')" class="calc-btn btn-number">3</button>
        <button onclick="appendToken('+')" class="calc-btn btn-operator">+</button>
        <button onclick="appendToken('-')" class="calc-btn btn-operator">−</button>

        <!-- Row 6: 0 . π Ans = -->
        <button onclick="appendToken('0')" class="calc-btn btn-number">0</button>
        <button onclick="appendToken('.')" class="calc-btn btn-number">.</button>
        <button onclick="appendToken('pi')" class="calc-btn btn-scientific">π</button>
        <button onclick="appendAns()" class="calc-btn btn-ans">Ans</button>
        <button onclick="executeCalculation()" class="calc-btn btn-equals">=</button>
    </div>

    <script>
        const inputBuf = document.getElementById('input-buffer');
        const latexDisplay = document.getElementById('latex-display');
        const numDisplay = document.getElementById('numerical-display');
        const moreRow = document.getElementById('more-functions-row');
        
        let lastAnswer = '';

        function appendToken(token) {
            inputBuf.value += token;
            renderPreview(inputBuf.value);
        }

        function appendAns() {
            if (lastAnswer === '') {
                inputBuf.value += '0';
            } else {
                inputBuf.value += '(' + lastAnswer + ')';
            }
            renderPreview(inputBuf.value);
        }

        function toggleMore() {
            if (moreRow.style.display === 'none') {
                moreRow.style.display = 'grid';
            } else {
                moreRow.style.display = 'none';
            }
        }

        function clearBuffer() {
            inputBuf.value = '';
            latexDisplay.innerHTML = '';
            numDisplay.innerText = '';
            moreRow.style.display = 'none';
        }

        function backspace() {
            inputBuf.value = inputBuf.value.slice(0, -1);
            renderPreview(inputBuf.value);
        }

        function renderPreview(text) {
            if (!text) {
                latexDisplay.innerHTML = '';
                return;
            }
            let formatted = text.replace(/\*/g, '\\cdot ').replace(/\//g, '\\div ');
            try {
                katex.render(formatted, latexDisplay, { throwOnError: false });
            } catch (err) {
                // Silently fail on parse errors during preview
            }
        }

        async function executeCalculation() {
            const rawExpr = inputBuf.value;
            if (!rawExpr) return;

            latexDisplay.innerHTML = '<span class="text-sm text-cyan-500 tracking-wider">Computing...</span>';
            
            try {
                const response = await fetch('/api/compute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expression: rawExpr, precision: 120 })
                });
                
                const data = await response.json();
                if (data.status === 'success') {
                    katex.render(data.latex_output, latexDisplay, { throwOnError: false });
                    numDisplay.innerText = '= ' + data.numerical_output;
                    lastAnswer = data.numerical_output;
                } else {
                    latexDisplay.innerHTML = '<span class="text-sm text-rose-500">Syntax Error</span>';
                    numDisplay.innerText = '';
                }
            } catch (e) {
                latexDisplay.innerHTML = '<span class="text-sm text-rose-500">Computation Error</span>';
                numDisplay.innerText = '';
            }
        }

        // Prevent native keyboard from opening on any focus
        document.addEventListener('touchstart', function(e) {
            if (e.target.tagName === 'INPUT') {
                e.target.blur();
            }
        }, { passive: false });
    </script>
</body>
</html>
