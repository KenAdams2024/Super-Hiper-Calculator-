<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NetCalc Scientific</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
        }
        body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        input, textarea {
            -webkit-user-select: none;
            user-select: none;
        }
        .calc-btn {
            transition: background-color 0.08s ease, transform 0.08s ease;
            -webkit-tap-highlight-color: transparent;
            active: state;
            border: none;
            cursor: pointer;
        }
        .calc-btn:active {
            transform: scale(0.94);
            background-color: rgba(226, 232, 240, 0.15);
        }
        .display-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 0;
        }
        .expression-line {
            font-size: 0.75rem;
            color: rgb(100, 116, 139);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        .expression-input {
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
            color: rgb(34, 197, 94);
            background: transparent;
            border: none;
            outline: none;
            margin-bottom: 0.5rem;
            padding: 0;
        }
        .result-display {
            font-size: 1.75rem;
            font-weight: 300;
            color: rgb(226, 232, 240);
            word-break: break-word;
            min-height: 2.5rem;
            padding: 0.5rem 0;
        }
        .numerical-display {
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
            color: rgb(251, 191, 36);
            margin-top: 0.5rem;
            min-height: 1.25rem;
            overflow-x: auto;
            white-space: nowrap;
            opacity: 0.75;
        }
        .keypad-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.375rem;
            padding: 0.5rem;
            background: rgb(15, 23, 42);
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }
        .btn-scientific {
            background-color: rgb(30, 41, 59);
            color: rgb(34, 211, 238);
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            line-height: 1.2;
        }
        .btn-number {
            background-color: rgba(51, 65, 85, 0.4);
            color: rgb(226, 232, 240);
            font-size: 1.125rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-family: 'Courier New', monospace;
        }
        .btn-operator {
            background-color: rgb(30, 41, 59);
            color: rgb(34, 211, 238);
            font-size: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }
        .btn-clear {
            background-color: rgba(159, 18, 57, 0.4);
            color: rgb(251, 113, 133);
            font-size: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .btn-equals {
            background: linear-gradient(to right, rgb(6, 182, 212), rgb(59, 130, 246));
            color: white;
            font-size: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.1);
        }
        .btn-equals:active {
            box-shadow: 0 5px 10px -2px rgba(6, 182, 212, 0.2);
        }
        .btn-ans {
            background-color: rgb(30, 41, 59);
            color: rgb(251, 191, 36);
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
        }
        .more-functions {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.375rem;
            padding: 0.375rem 0.5rem;
            background: rgb(20, 29, 48);
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }
        .more-functions button {
            font-size: 0.65rem;
            padding: 0.375rem;
            background-color: rgb(30, 41, 59);
            color: rgb(148, 163, 184);
        }
        .cas-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .cas-modal-overlay.active {
            display: flex;
        }
        .cas-modal {
            background: rgb(15, 23, 42);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 0.75rem;
            padding: 1rem;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            color: rgb(226, 232, 240);
        }
        .cas-modal h3 {
            font-size: 0.875rem;
            font-weight: 600;
            color: rgb(34, 211, 238);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .cas-modal-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .cas-modal-button {
            background-color: rgb(30, 41, 59);
            color: rgb(226, 232, 240);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background-color 0.1s ease;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }
        .cas-modal-button:active {
            background-color: rgb(51, 65, 85);
        }
        .cas-input-section {
            margin-bottom: 0.75rem;
        }
        .cas-input-section label {
            font-size: 0.7rem;
            color: rgb(148, 163, 184);
            display: block;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .cas-input-section input {
            background-color: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 0.375rem;
            color: rgb(34, 197, 94);
            padding: 0.375rem 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            width: 100%;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        .cas-template-display {
            background-color: rgba(2, 6, 23, 0.8);
            border-left: 2px solid rgb(34, 211, 238);
            padding: 0.5rem;
            margin: 0.5rem 0;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: rgb(34, 197, 94);
        }
        .cas-modal-close {
            background-color: rgba(159, 18, 57, 0.4);
            color: rgb(251, 113, 133);
            border: 1px solid rgba(159, 18, 57, 0.5);
            border-radius: 0.375rem;
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 0.75rem;
        }
        .header-bar {
            background: linear-gradient(to bottom, rgb(15, 23, 42), rgb(2, 6, 23));
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
            padding: 0.5rem 0.75rem;
        }
        .safe-area-inset-bottom {
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
        }
        @supports (padding: max(0px)) {
            .keypad-container {
                padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans flex flex-col overflow-hidden">

    <!-- Header Bar -->
    <div class="header-bar text-center text-xs font-semibold text-slate-400 tracking-wider">
        NetCalc Scientific
    </div>

    <!-- Display Section: Compact 3-level hierarchy -->
    <div class="display-section flex-grow px-3 py-2 bg-gradient-to-b from-slate-900 to-slate-950 min-h-0">
        <!-- Expression label -->
        <div class="expression-line">Expression</div>
        <!-- Expression buffer -->
        <input id="input-buffer" type="text" class="expression-input" placeholder="0" readonly inputmode="none">
        <!-- Main result display (KaTeX) -->
        <div id="latex-display" class="result-display"></div>
        <!-- Numerical result -->
        <div id="numerical-display" class="numerical-display"></div>
    </div>

    <!-- More Functions Row (Toggle) -->
    <div id="more-functions-row" class="more-functions" style="display: none;">
        <button onclick="appendToken('sin('); toggleMore();" class="calc-btn btn-scientific">sin</button>
        <button onclick="appendToken('cos('); toggleMore();" class="calc-btn btn-scientific">cos</button>
        <button onclick="appendToken('tan('); toggleMore();" class="calc-btn btn-scientific">tan</button>
        <button onclick="appendToken('exp('); toggleMore();" class="calc-btn btn-scientific">exp</button>
        <button onclick="appendToken('ln('); toggleMore();" class="calc-btn btn-scientific">ln</button>
        <button onclick="appendToken('asin('); toggleMore();" class="calc-btn btn-scientific">asin</button>
        <button onclick="appendToken('acos('); toggleMore();" class="calc-btn btn-scientific">acos</button>
        <button onclick="appendToken('atan('); toggleMore();" class="calc-btn btn-scientific">atan</button>
        <button onclick="appendToken('sinh('); toggleMore();" class="calc-btn btn-scientific">sinh</button>
        <button onclick="appendToken('cosh('); toggleMore();" class="calc-btn btn-scientific">cosh</button>
        <button onclick="appendToken('tanh('); toggleMore();" class="calc-btn btn-scientific">tanh</button>
        <button onclick="appendToken('abs('); toggleMore();" class="calc-btn btn-scientific">abs</button>
        <button onclick="appendToken('factorial('); toggleMore();" class="calc-btn btn-scientific">!</button>
        <button onclick="appendToken('E');" class="calc-btn btn-scientific">e</button>
        <button onclick="toggleMore();" class="calc-btn btn-scientific" style="color: rgb(251, 113, 133);">↓</button>
    </div>

    <!-- CAS Modals -->
    <div id="derivative-modal" class="cas-modal-overlay">
        <div class="cas-modal">
            <h3>d/dx Derivative</h3>
            <p style="font-size: 0.75rem; color: rgb(148, 163, 184); margin-bottom: 0.75rem;">Enter the expression to differentiate</p>
            <div class="cas-input-section">
                <label>Expression</label>
                <input type="text" id="deriv-expr" placeholder="e.g., x^2 + 3*x" readonly>
            </div>
            <div class="cas-template-display" id="deriv-template">d/dx [ x^2 + 3*x ]</div>
            <button class="calc-btn btn-operator" style="width: 100%; margin-bottom: 0.5rem;" onclick="insertDerivative()">Insert</button>
            <button class="cas-modal-close" onclick="closeCasModal('derivative-modal')">Cancel</button>
        </div>
    </div>

    <div id="integral-modal" class="cas-modal-overlay">
        <div class="cas-modal">
            <h3>∫ Integral</h3>
            <p style="font-size: 0.75rem; color: rgb(148, 163, 184); margin-bottom: 0.75rem;">Enter the expression to integrate</p>
            <div class="cas-input-section">
                <label>Expression</label>
                <input type="text" id="integ-expr" placeholder="e.g., x^2 + 3*x" readonly>
            </div>
            <div class="cas-template-display" id="integ-template">∫ [ x^2 + 3*x ] dx</div>
            <button class="calc-btn btn-operator" style="width: 100%; margin-bottom: 0.5rem;" onclick="insertIntegral()">Insert</button>
            <button class="cas-modal-close" onclick="closeCasModal('integral-modal')">Cancel</button>
        </div>
    </div>

    <div id="limit-modal" class="cas-modal-overlay">
        <div class="cas-modal">
            <h3>lim Limit</h3>
            <p style="font-size: 0.75rem; color: rgb(148, 163, 184); margin-bottom: 0.75rem;">Enter expression and limit point</p>
            <div class="cas-input-section">
                <label>Expression</label>
                <input type="text" id="limit-expr" placeholder="e.g., sin(x)/x" readonly>
            </div>
            <div class="cas-input-section">
                <label>As x approaches</label>
                <input type="text" id="limit-point" placeholder="e.g., 0" readonly>
            </div>
            <div class="cas-template-display" id="limit-template">lim x→0 [ sin(x)/x ]</div>
            <button class="calc-btn btn-operator" style="width: 100%; margin-bottom: 0.5rem;" onclick="insertLimit()">Insert</button>
            <button class="cas-modal-close" onclick="closeCasModal('limit-modal')">Cancel</button>
        </div>
    </div>

    <!-- Main Keypad -->
    <div class="keypad-container safe-area-inset-bottom">
        <!-- Row 1: Advanced functions + X -->
        <button onclick="openCasModal('derivative-modal');" class="calc-btn btn-scientific">d/dx</button>
        <button onclick="openCasModal('integral-modal');" class="calc-btn btn-scientific">∫</button>
        <button onclick="openCasModal('limit-modal');" class="calc-btn btn-scientific">lim</button>
        <button onclick="toggleMore();" class="calc-btn btn-scientific" title="Toggle MORE functions">MORE</button>
        <button onclick="appendToken('x')" class="calc-btn btn-number" style="color: rgb(251, 191, 36); font-weight: 700;">X</button>

        <!-- Row 2: sqrt, power, log, parens -->
        <button onclick="appendToken('sqrt(')" class="calc-btn btn-scientific">√</button>
        <button onclick="appendToken('^')" class="calc-btn btn-scientific">xʸ</button>
        <button onclick="appendToken('log(')" class="calc-btn btn-scientific">log</button>
        <button onclick="appendToken('(')" class="calc-btn btn-operator">(</button>
        <button onclick="appendToken(')')" class="calc-btn btn-operator">)</button>

        <!-- Row 3: 7 8 9 AC DEL -->
        <button onclick="appendToken('7')" class="calc-btn btn-number">7</button>
        <button onclick="appendToken('8')" class="calc-btn btn-number">8</button>
        <button onclick="appendToken('9')" class="calc-btn btn-number">9</button>
        <button onclick="clearBuffer()" class="calc-btn btn-clear">AC</button>
        <button onclick="backspace()" class="calc-btn btn-operator">DEL</button>

        <!-- Row 4: 4 5 6 * / -->
        <button onclick="appendToken('4')" class="calc-btn btn-number">4</button>
        <button onclick="appendToken('5')" class="calc-btn btn-number">5</button>
        <button onclick="appendToken('6')" class="calc-btn btn-number">6</button>
        <button onclick="appendToken('*')" class="calc-btn btn-operator">×</button>
        <button onclick="appendToken('/')" class="calc-btn btn-operator">÷</button>

        <!-- Row 5: 1 2 3 + − -->
        <button onclick="appendToken('1')" class="calc-btn btn-number">1</button>
        <button onclick="appendToken('2')" class="calc-btn btn-number">2</button>
        <button onclick="appendToken('3')" class="calc-btn btn-number">3</button>
        <button onclick="appendToken('+')" class="calc-btn btn-operator">+</button>
        <button onclick="appendToken('-')" class="calc-btn btn-operator">−</button>

        <!-- Row 6: 0 . π Ans = (exactly 5 equal columns) -->
        <button onclick="appendToken('0')" class="calc-btn btn-number">0</button>
        <button onclick="appendToken('.')" class="calc-btn btn-number">.</button>
        <button onclick="appendToken('pi')" class="calc-btn btn-scientific">π</button>
        <button onclick="appendAns()" class="calc-btn btn-ans">Ans</button>
        <button onclick="executeCalculation()" class="calc-btn btn-equals">=</button>
    </div>

    <script>
        const inputBuf = document.getElementById('input-buffer');
        const latexDisplay = document.getElementById('latex-display');
        const numDisplay = document.getElementById('numerical-display');
        const moreRow = document.getElementById('more-functions-row');
        
        let lastAnswer = '';
        let casCurrentExpr = ''; // Store current expression for CAS operations
        
        // Hidden CAS state: tracks the active CAS operation
        let casState = {
            active: false,           // Whether CAS mode is active
            type: null,              // 'derivative', 'integral', or 'limit'
            displayText: '',         // Natural-form display text (e.g., "d/dx [x^2]")
            baseExpr: '',            // Base expression
            limitPoint: ''           // For limit only
        };

        function appendToken(token) {
            // Exit CAS mode on normal keypad input
            exitCasMode();
            inputBuf.value += token;
            renderPreview(inputBuf.value);
        }

        function appendAns() {
            // Exit CAS mode on normal keypad input
            exitCasMode();
            if (lastAnswer === '') {
                inputBuf.value += '0';
            } else {
                inputBuf.value += '(' + lastAnswer + ')';
            }
            renderPreview(inputBuf.value);
        }

        function toggleMore() {
            if (moreRow.style.display === 'none') {
                moreRow.style.display = 'grid';
            } else {
                moreRow.style.display = 'none';
            }
        }

        function clearBuffer() {
            inputBuf.value = '';
            latexDisplay.innerHTML = '';
            numDisplay.innerText = '';
            moreRow.style.display = 'none';
            casState = { active: false, type: null, displayText: '', baseExpr: '', limitPoint: '' };
        }

        function backspace() {
            inputBuf.value = inputBuf.value.slice(0, -1);
            renderPreview(inputBuf.value);
            // If buffer becomes empty after backspace, exit CAS mode
            if (!inputBuf.value) {
                exitCasMode();
            }
        }

        function renderPreview(text) {
            if (!text) {
                latexDisplay.innerHTML = '';
                return;
            }
            let formatted = text.replace(/\*/g, '\\cdot ').replace(/\//g, '\\div ');
            try {
                katex.render(formatted, latexDisplay, { throwOnError: false });
            } catch (err) {
                // Silently fail on parse errors during preview
            }
        }

        // ===== CAS State Management =====
        function exitCasMode() {
            casState = { active: false, type: null, displayText: '', baseExpr: '', limitPoint: '' };
        }

        // ===== CAS Modal Functions =====
        function openCasModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('active');
            casCurrentExpr = inputBuf.value;
            
            if (modalId === 'derivative-modal') {
                document.getElementById('deriv-expr').value = casCurrentExpr;
                updateDerivativeTemplate();
            } else if (modalId === 'integral-modal') {
                document.getElementById('integ-expr').value = casCurrentExpr;
                updateIntegralTemplate();
            } else if (modalId === 'limit-modal') {
                document.getElementById('limit-expr').value = casCurrentExpr;
                updateLimitTemplate();
            }
        }

        function closeCasModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('active');
        }

        function updateDerivativeTemplate() {
            const expr = document.getElementById('deriv-expr').value;
            document.getElementById('deriv-template').innerText = `d/dx [ ${expr} ]`;
        }

        function updateIntegralTemplate() {
            const expr = document.getElementById('integ-expr').value;
            document.getElementById('integ-template').innerText = `∫ [ ${expr} ] dx`;
        }

        function updateLimitTemplate() {
            const expr = document.getElementById('limit-expr').value;
            const point = document.getElementById('limit-point').value || 'a';
            document.getElementById('limit-template').innerText = `lim x→${point} [ ${expr} ]`;
        }

        // ===== Insert Functions: Store Hidden CAS State =====
        function insertDerivative() {
            const expr = document.getElementById('deriv-expr').value;
            if (!expr) return;
            
            // Store hidden CAS state
            casState = {
                active: true,
                type: 'derivative',
                displayText: `d/dx [ ${expr} ]`,
                baseExpr: expr,
                limitPoint: ''
            };
            
            // Display natural form
            inputBuf.value = casState.displayText;
            renderPreview(casState.displayText);
            closeCasModal('derivative-modal');
        }

        function insertIntegral() {
            const expr = document.getElementById('integ-expr').value;
            if (!expr) return;
            
            // Store hidden CAS state
            casState = {
                active: true,
                type: 'integral',
                displayText: `∫ [ ${expr} ] dx`,
                baseExpr: expr,
                limitPoint: ''
            };
            
            // Display natural form
            inputBuf.value = casState.displayText;
            renderPreview(casState.displayText);
            closeCasModal('integral-modal');
        }

        function insertLimit() {
            const expr = document.getElementById('limit-expr').value;
            const point = document.getElementById('limit-point').value || '0';
            if (!expr) return;
            
            // Store hidden CAS state
            casState = {
                active: true,
                type: 'limit',
                displayText: `lim x→${point} [ ${expr} ]`,
                baseExpr: expr,
                limitPoint: point
            };
            
            // Display natural form
            inputBuf.value = casState.displayText;
            renderPreview(casState.displayText);
            closeCasModal('limit-modal');
        }

        // ===== Execute: Translate Hidden CAS State to SymPy Syntax =====
        async function executeCalculation() {
            let rawExpr = inputBuf.value;
            if (!rawExpr) return;

            // Translate hidden CAS state to SymPy syntax if in CAS mode
            if (casState.active && casState.type) {
                if (casState.type === 'derivative') {
                    rawExpr = `diff(${casState.baseExpr})`;
                } else if (casState.type === 'integral') {
                    rawExpr = `integrate(${casState.baseExpr})`;
                } else if (casState.type === 'limit') {
                    rawExpr = `limit(${casState.baseExpr}, x, ${casState.limitPoint})`;
                }
            }

            latexDisplay.innerHTML = '<span class="text-sm text-cyan-500 tracking-wider">Computing...</span>';
            
            try {
                const response = await fetch('/api/compute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expression: rawExpr, precision: 120 })
                });
                
                const data = await response.json();
                if (data.status === 'success') {
                    katex.render(data.latex_output, latexDisplay, { throwOnError: false });
                    numDisplay.innerText = '= ' + data.numerical_output;
                    lastAnswer = data.numerical_output;
                    // Exit CAS mode after successful execution
                    exitCasMode();
                } else {
                    latexDisplay.innerHTML = '<span class="text-sm text-rose-500">Syntax Error</span>';
                    numDisplay.innerText = '';
                }
            } catch (e) {
                latexDisplay.innerHTML = '<span class="text-sm text-rose-500">Computation Error</span>';
                numDisplay.innerText = '';
            }
        }

        // Prevent native keyboard from opening on any focus
        document.addEventListener('touchstart', function(e) {
            if (e.target.tagName === 'INPUT') {
                e.target.blur();
            }
        }, { passive: false });

        // Close CAS modals on background click
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('cas-modal-overlay')) {
                e.target.classList.remove('active');
            }
        });
    </script>
</body>
</html>
